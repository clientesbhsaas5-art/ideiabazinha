<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bartlas — gestão e precificação gráfica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237a5cc7'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-size='23' font-weight='700' text-anchor='middle' fill='white'%3EB%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#ffffff;--card:#ffffff;--ink:#231d33;--ink2:#4a4360;--muted:#756f88;--line:#e8e4f1;--line2:#d9d3e8;
  --accent:#7a5cc7;--accent2:#6a4bb8;--soft:#f7f5fc;--tint:#efeaf9;--deep:#2b2146;
  --warn:#9a6a14;--bad:#b0413e;--ok:#3a7a55;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:14px;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.col{flex:1;min-width:0}
/* menu lateral */
aside{width:236px;background:#faf9fd;border-right:1px solid var(--line);padding:24px 14px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 12px 20px}
.mark{font:700 36px/1 var(--serif);color:var(--accent)}
.word{font-weight:600;font-size:16px;letter-spacing:-.01em}
.ng{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:20px 12px 6px}
nav a{display:block;padding:7px 12px;border-radius:8px;color:var(--ink2);text-decoration:none;font-size:13.5px;margin-bottom:1px;transition:background .15s,color .15s}
nav a:hover{background:var(--tint);color:var(--ink)}
nav a.on{background:var(--tint);color:var(--accent2);font-weight:600}
#userbox{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line);font-size:12px}
#userbox select{font-size:13px;height:32px}
.side-foot{font-size:11px;color:var(--muted);padding:10px 12px 0;line-height:1.4}
/* cabeçalho */
#top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.crumb i{font-style:normal;margin:0 8px;color:var(--line2)}.crumb b{color:var(--ink);font-weight:600}
main{padding:34px 40px 90px;max-width:1220px}
h1{font-family:var(--serif);font-weight:400;font-size:31px;letter-spacing:-.012em;line-height:1.15;margin:0 0 8px;color:var(--ink)}
.sub{color:var(--muted);margin:0 0 30px;max-width:66ch;font-size:14px}
/* seções (no lugar de cards) */
.grid{display:grid;gap:0 56px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.gp{display:grid;gap:0 56px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
@media(max-width:1100px){.gp{grid-template-columns:1fr}}
.card{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:22px 0 10px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
/* faixa de indicadores */
.g4{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line);margin-bottom:12px}
.g4>.card{flex:1 1 170px;border-top:0;border-left:1px solid var(--line);padding:20px 24px;min-width:0}
.g4>.card:first-child{border-left:0;padding-left:0}
.kpi small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
.kpi b{display:block;font-size:25px;font-weight:600;margin-top:6px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--warn)}
/* formulários */
label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:6px}
input,select,textarea{width:100%;height:36px;padding:0 11px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:14px;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 11px;line-height:1.55}
input:hover,select:hover,textarea:hover{border-color:#c4bbdc}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,92,199,.16)}
input::placeholder{color:#a9a4ba}
td input,td select{height:30px;padding:0 8px;font-size:13px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
/* botões */
button{font:inherit;font-size:13.5px;font-weight:500;height:36px;padding:0 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;transition:background .15s,border-color .15s,transform .06s}
button:hover{background:var(--accent2);border-color:var(--accent2)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line2)}
button.ghost:hover{background:var(--soft);border-color:#c4bbdc}
button.danger{background:transparent;color:var(--muted);border-color:transparent;padding:0 8px;font-size:17px;line-height:1}
button.danger:hover{color:var(--bad);background:#fbf1f1;border-color:transparent}
button.sm{height:28px;padding:0 11px;font-size:12.5px}
button.danger.sm{padding:0 8px}
/* tabelas */
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 14px 10px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{padding-right:0}
.tr{text-align:right}
td.sub{margin:0}
td select{min-width:118px}
td:first-child{white-space:nowrap}
/* situação */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-rascunho{color:var(--muted)}.p-enviada{color:#4a5db0}.p-aprovada,.p-pago{color:var(--ok)}.p-recusada,.p-atrasado{color:var(--bad)}.p-aberto{color:var(--warn)}
/* resultado da calculadora */
.res{display:block}
.res div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.res small{font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0}
.res b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.res .big{display:block;background:var(--deep);color:#fff;padding:22px 24px;border:0;border-radius:8px;margin-bottom:6px}
.big small{display:block;color:#c9bdea;font-size:12px}
.big b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px}
.sig{padding:10px 14px;border-radius:4px;font-size:13px;margin:14px 0 0;font-weight:500;border-left:2px solid currentColor;background:var(--soft)}
.sig.ok{color:var(--ok)}.sig.mid{color:var(--warn)}.sig.bad{color:var(--bad)}
/* gráfico e progresso */
.bars{display:flex;align-items:flex-end;gap:14px;height:160px;padding-top:10px;border-bottom:1px solid var(--line2)}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;max-width:38px;background:#cbbdec;border-radius:3px 3px 0 0;min-height:2px;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.7,.2,1) both}
.bars div:last-child i{background:var(--accent)}
.prog{height:4px;background:var(--tint);border-radius:2px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .6s}
.empty{color:var(--muted);padding:26px 0;font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
/* quadro e chat */
.kan{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.kan>div{background:var(--soft);border-radius:12px;padding:14px;min-height:90px}
.tk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.chat{max-height:400px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{padding:10px 14px;border-radius:8px;font-size:14px;max-width:80%;white-space:pre-line}
.me{align-self:flex-end;background:var(--accent);color:#fff}.bot{background:var(--soft)}
/* documento em tela cheia */
#overlay{position:fixed;inset:0;background:rgba(35,29,51,.5);display:none;align-items:flex-start;justify-content:center;padding:36px 12px;overflow:auto;z-index:20;animation:fade .2s both}
#doc{background:#fff;color:#111;width:100%;max-width:760px;border-radius:8px;padding:44px;box-shadow:0 24px 60px rgba(35,29,51,.28);animation:rise .25s both}
#doc h2{margin:0;font-family:var(--serif);font-weight:400}#doc table th{color:#555}#doc td,#doc th{border-color:#ddd}
.tot{font-size:22px;text-align:right;margin-top:18px}

/* menu com módulos */
.ic{flex:none}
nav a{display:flex;align-items:center;gap:11px}
nav a .ic{color:var(--muted);transition:color .15s}
nav a:hover .ic,nav a.on .ic{color:var(--accent)}
.ng{padding:22px 12px 6px}
.gh{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:500;user-select:none;transition:background .15s}
.gh:hover{background:var(--tint)}
.gh>.ic:first-child{color:var(--accent)}
.gh span{flex:1}
.gh .chev{color:var(--muted);transition:transform .25s}
.grp.open .gh .chev{transform:rotate(90deg)}
.gi{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.grp.open .gi{grid-template-rows:1fr}
.gi>div{overflow:hidden;min-height:0;padding-left:16px;margin-left:18px;border-left:1px solid var(--line)}
.gi a{font-size:13px;padding:6px 12px}
.fab{position:fixed;right:28px;bottom:28px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(122,92,199,.32);transition:transform .2s,background .15s;z-index:10}
.fab:hover{background:var(--accent2);transform:translateY(-2px)}
/* painel */
.qa{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);border-bottom:1px solid var(--line);margin-bottom:40px}
.qa a{flex:1 1 170px;display:flex;align-items:center;gap:12px;padding:16px 18px 16px 0;text-decoration:none;color:var(--ink)}
.qa a+a{border-left:1px solid var(--line);padding-left:22px}
.qa i{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex:none;transition:background .2s,color .2s}
.qa a:hover i{background:var(--accent);color:#fff}
.qa b{display:block;font-size:14px;font-weight:600}.qa small{display:block;font-size:12px;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 72px;margin-bottom:40px}
@media(max-width:1000px){.dash{grid-template-columns:1fr;gap:40px}}
section .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;font-size:13px;color:var(--muted)}
section .sh h3{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
section .sh a{color:var(--accent2);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:500}
section .sh a:hover{text-decoration:underline}
.sh b{color:var(--ink)}
.gauge{position:relative;max-width:300px;margin:0 auto}
.gauge svg{display:block;width:100%;overflow:visible}
.gp1{animation:garc 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes garc{from{stroke-dasharray:0 251.3}}
.gnum{text-align:center;font:400 44px/1 var(--serif);margin-top:2px;letter-spacing:-.02em}
.gnum small{font:500 18px var(--sans);color:var(--muted);margin-left:2px}
.gcap{text-align:center;margin:12px 0 4px;font-size:13.5px;color:var(--muted)}.gcap b{color:var(--ink);font-weight:600}
.gmsg{margin:6px 0 0;font-size:13px;color:var(--muted);text-align:center}
.evo+.gmsg,.evo~.gmsg{text-align:left}
.evo{padding-top:14px}
.track{position:relative;height:8px;background:var(--tint);border-radius:5px}
.track i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.track u{position:absolute;top:-6px;width:2px;height:20px;background:var(--ink2);border-radius:1px}
.track u.m{background:var(--deep)}
.leg{display:flex;justify-content:space-between;gap:16px;margin-top:16px}
.leg small{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.leg b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.leg div:nth-child(2){text-align:center}.leg div:last-child{text-align:right}
section.wide{border-top:1px solid var(--line);padding-top:24px}
.agl td:first-child{padding-left:0}
@media(max-width:820px){.grp{display:flex}.gi{display:flex;grid-template-rows:none}.gi>div{display:flex;overflow:visible;padding:0;margin:0;border:0}.gh{display:none}.gi a{font-size:13.5px;padding:7px 12px}.fab{right:16px;bottom:16px}.qa a{flex-basis:45%}.qa a+a{border-left:0;padding-left:0}}
@media print{.fab{display:none!important}}

/* movimento */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#view.enter>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(n+5){animation-delay:.16s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:820px){
  body{flex-direction:column}
  aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:8px 10px;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0 14px 0 4px}.word{display:none}.ng{display:none}nav{display:flex}nav a{white-space:nowrap}
  #userbox{margin:0 0 0 8px;padding:0 0 0 8px;border:0;min-width:150px}.side-foot{display:none}label{margin-bottom:4px}
  #top{padding:0 16px;height:46px}main{padding:22px 16px 60px}h1{font-size:26px}
  .g4>.card{flex-basis:45%;padding:16px 14px}.g4>.card:first-child{padding-left:14px}
  .res .big b{font-size:28px}
}
@media print{
  body{background:#fff;display:block}aside,main,#top{display:none!important}
  #overlay{position:static;display:block!important;background:none;padding:0;animation:none}
  #doc{box-shadow:none;max-width:none;padding:0;animation:none}.noprint{display:none!important}
}
</style>
</head>
<body>
<aside>
  <div class="logo"><span class="mark">B</span><span class="word">Bartlas</span></div>
  <nav id="nav"></nav>
  <div id="userbox"></div>
  <div class="side-foot">Dados salvos só neste navegador. Faça backup em Ajustes.</div>
</aside>
<div class="col"><header id="top"></header><main id="view"></main></div>
<a class="fab" id="fab" href="#assistente" title="Assistente" aria-label="Abrir assistente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
<div id="overlay"><div id="doc"></div></div>

<script>
/* ===== Estado e utilitários ===== */
const LS='bartlas.v1';
const DEF={clientes:[],propostas:[],lancamentos:[],seq:0,
  fornecedores:[],estoque:[],compras:[],pedidos:[],os:[],centros:[],equipe:[],projetos:[],tarefas:[],agenda:[],contratos:[],portfolio:[],catalogo:[],user:null,seqPed:0,seqOS:0,
  modeloContrato:'CONTRATO DE PRESTAÇÃO DE SERVIÇOS GRÁFICOS\n\nCONTRATADA: {{empresa}}\nCONTRATANTE: {{cliente}}\n\n1. OBJETO: {{descricao}}, quantidade {{quantidade}}.\n2. VALOR: {{valor}}, a ser pago conforme combinado entre as partes.\n3. PRAZO DE ENTREGA: {{prazo}}.\n4. APROVAÇÃO DE ARTE: a produção só começa após a aprovação da arte pelo contratante; alterações depois da aprovação podem gerar cobrança adicional.\n5. Qualquer alteração deste contrato deve ser feita por escrito.\n\nData: {{data}}\n\n_______________________      _______________________\nContratada                              Contratante\n\n(Modelo genérico: revise com um profissional jurídico antes de usar.)',
  config:{empresa:'Minha Gráfica',custoFixo:0,meta:20000,imposto:6,despesas:10,comissao:0,margem:30,validade:7}};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(LS));if(r){r.config={...DEF.config,...r.config};return {...JSON.parse(JSON.stringify(DEF)),...r}}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct=n=>(Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const cliNome=id=>(S.clientes.find(c=>c.id===id)||{}).nome||'—';

/* ===== Motor de precificação ===== */
function compute(items,qty,p,method){
  qty=Math.max(1,Math.floor(qty)||1);
  const unitVar=items.filter(i=>i.t==='unit').reduce((a,i)=>a+num(i.q)*num(i.c),0);
  const fixo=items.filter(i=>i.t==='fixo').reduce((a,i)=>a+num(i.q)*num(i.c),0);
  const custo=unitVar*qty+fixo;
  const ded=(num(p.imposto)+num(p.despesas)+num(p.comissao))/100;
  let preco=0,erro='';
  if(method==='margem'){
    const den=1-ded-num(p.margem)/100;
    if(den<=0.02){erro='Impostos + despesas + comissão + margem somam 98% ou mais do preço. Reduza algum percentual.';}
    else preco=custo/den;
  }else{
    preco=custo*(1+num(p.margem)/100);
  }
  const minimo=ded<1?custo/(1-ded):0;
  const lucro=preco-custo-preco*ded;
  return {qty,unitVar,fixo,custo,preco,unit:preco/qty,minimo,minUnit:minimo/qty,lucro,mReal:preco?lucro/preco:0,ded,erro};
}

/* ===== Navegação ===== */
const views={dashboard:vDash,preco:vPreco,propostas:vPropostas,clientes:vClientes,financeiro:vFin,config:vConfig};
function route(){
  let k=(location.hash||'#dashboard').slice(1);
  if(!views[k]||!can(k))k=can('dashboard')?'dashboard':(ROLES[papel()]||['tarefas'])[0];
  buildNav(k);const v=$('#view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');
  views[k]();window.scrollTo(0,0);setTimeout(()=>v.classList.remove('enter'),520);
}
window.addEventListener('hashchange',route);

/* ===== Financeiro: helpers ===== */
function stLanc(l){if(l.pago)return 'pago';return l.venc&&l.venc<today()?'atrasado':'aberto'}
function mesKey(d){return d.slice(0,7)}
function somaMes(tipo,mk){return S.lancamentos.filter(l=>l.tipo===tipo&&l.pago&&mesKey(l.pagoEm||l.venc)===mk).reduce((a,l)=>a+l.valor,0)}

/* ===== Painel ===== */
function relDia(d){const n=Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);return n===0?'hoje':n===1?'amanhã':n>1?'em '+n+' dias':'há '+(-n)+(n===-1?' dia':' dias')}
function vDash(){
  const now=new Date(),mk=mesKey(today()),rec=somaMes('receber',mk),pag=somaMes('pagar',mk);
  const meta=num(S.config.meta),cf=num(S.config.custoFixo);
  const dia=now.getDate(),dm=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const proj=rec/dia*dm,pr=meta?Math.min(1,rec/meta):0,ang=pr*Math.PI;
  const nx=(100-62*Math.cos(ang)).toFixed(1),ny=(100-62*Math.sin(ang)).toFixed(1),arc=(pr*251.3).toFixed(1);
  const be=cf>0?cf/Math.max(.05,1-(num(S.config.imposto)+num(S.config.comissao))/100):0;
  const mx=Math.max(rec,meta,be,1)*1.08;
  const aRec=S.lancamentos.filter(l=>l.tipo==='receber'&&!l.pago).reduce((a,l)=>a+l.valor,0);
  const aPag=S.lancamentos.filter(l=>l.tipo==='pagar'&&!l.pago).reduce((a,l)=>a+l.valor,0);
  const abertas=S.propostas.filter(p=>p.status==='rascunho'||p.status==='enviada');
  const emProd=S.pedidos.filter(p=>p.status==='em produção').length;
  const low=S.estoque.filter(e=>num(e.qtd)<=num(e.min)).length;
  const meses=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);meses.push({l:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),v:somaMes('receber',k)})}
  const mm=Math.max(1,...meses.map(m=>m.v));
  const td=today(),ev=eventos(),lista=[...ev.filter(e=>e.d<td).slice(-3),...ev.filter(e=>e.d>=td).slice(0,6)];
  const hr=now.getHours(),saud=hr<12?'Bom dia':hr<18?'Boa tarde':'Boa noite';
  let msgMeta='Defina a meta mensal em Ajustes.',clsMeta='';
  if(meta){ if(rec<=0){msgMeta='Nenhum recebimento neste mês ainda.'}
    else if(proj>=meta){msgMeta='No ritmo. Projeção de fechar o mês em '+brl(proj)+' ('+pct(proj/meta*100)+' da meta).';clsMeta='pos'}
    else {msgMeta='Abaixo do ritmo. Projeção de fechar o mês em '+brl(proj)+' ('+pct(proj/meta*100)+' da meta).';clsMeta='warn'} }
  let msgEvo='';
  if(!be)msgEvo='Informe os custos fixos mensais em Ajustes para ver o ponto de equilíbrio.';
  else if(meta&&rec>=meta)msgEvo='Meta do mês atingida. Tudo o que entrar acima daqui é lucro.';
  else if(rec>=be)msgEvo='Acima do ponto de equilíbrio. O que entrar a partir de agora é lucro'+(meta?'; faltam '+brl(meta-rec)+' para a meta.':'.');
  else msgEvo='Faltam '+brl(be-rec)+' para cobrir os custos fixos do mês.';
  const novo=!S.clientes.length&&!S.propostas.length;
  const qa=[['preco','calc','Calcular preço','Por processo'],['preco','file','Nova proposta','Do cálculo'],['clientes','users','Novo cliente','Contatos'],['pedidos','box','Novo pedido','Veja a margem'],['financeiro','wallet','Lançar conta','Pagar e receber']].filter(q=>can(q[0]));
  $('#view').innerHTML=`
  <h1>${saud}.</h1><p class="sub">${novo?'Comece por aqui: calcule um preço, vincule um cliente e gere a primeira proposta.':h(S.config.empresa)+' em '+now.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})+'.'}${low?` <a href="#estoque" class="neg">${low} item(ns) de estoque no mínimo.</a>`:''}</p>
  <div class="qa">${qa.map(q=>`<a href="#${q[0]}"><i>${ic(q[1],18)}</i><span><b>${q[2]}</b><small>${q[3]}</small></span></a>`).join('')}</div>
  <div class="dash">
    <section><div class="sh"><h3>Meta do mês</h3><a href="#financeiro">Detalhes ${ic('arrow',13)}</a></div>
      <div class="gauge"><svg viewBox="0 0 200 112" aria-hidden="true"><path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--tint)" stroke-width="13" stroke-linecap="round"/>
        <path class="gp1" d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${arc} 251.3"/>
        <line x1="100" y1="100" x2="${nx}" y2="${ny}" stroke="var(--deep)" stroke-width="2.4" stroke-linecap="round"/><circle cx="100" cy="100" r="5" fill="var(--deep)"/></svg>
        <div class="gnum">${meta?Math.round(pr*100):0}<small>%</small></div></div>
      <p class="gcap"><b>${brl(rec)}</b> de ${brl(meta)}</p><p class="gmsg ${clsMeta}">${h(msgMeta)}</p>
    </section>
    <section><div class="sh"><h3>Evolução do mês</h3><span>Recebido: <b>${brl(rec)}</b></span></div>
      <div class="evo"><div class="track"><i style="width:${(rec/mx*100).toFixed(1)}%"></i>${be?`<u style="left:${(be/mx*100).toFixed(1)}%"></u>`:''}${meta?`<u class="m" style="left:${(meta/mx*100).toFixed(1)}%"></u>`:''}</div>
      <div class="leg"><div><small>Recebido</small><b>${brl(rec)}</b></div><div><small>Ponto de equilíbrio</small><b>${be?brl(be):'—'}</b></div><div><small>Meta</small><b>${meta?brl(meta):'—'}</b></div></div></div>
      <p class="gmsg">${h(msgEvo)}</p>
      <div class="sh" style="margin-top:26px"><h3>Últimos 6 meses</h3><span>Resultado do mês: <b class="${rec-pag>=0?'pos':'neg'}">${brl(rec-pag)}</b></span></div>
      <div class="bars">${meses.map(m=>`<div><span>${m.v?Math.round(m.v):''}</span><i style="height:${m.v/mm*100}%"></i><span>${m.l}</span></div>`).join('')}</div>
    </section>
  </div>
  <section class="wide"><div class="sh"><h3>Próximos compromissos</h3><a href="#agenda">Ver agenda ${ic('arrow',13)}</a></div>
    ${lista.length?`<table class="agl">${lista.map(e=>`<tr><td>${h(e.t)}</td><td class="tr ${e.d<td?'neg':e.d===td?'warn':''}" style="white-space:nowrap">${fdate(e.d).slice(0,5)} · ${relDia(e.d)}</td></tr>`).join('')}</table>`:'<div class="empty">Nada agendado. Lançamentos, prazos de tarefas e validade de propostas aparecem aqui.</div>'}
  </section>
  <div class="g4" style="margin-top:34px">
    <div class="card kpi"><small>A receber</small><b>${brl(aRec)}</b></div>
    <div class="card kpi"><small>A pagar</small><b>${brl(aPag)}</b></div>
    <div class="card kpi"><small>Propostas abertas</small><b>${abertas.length}</b><span style="color:var(--muted)">${brl(abertas.reduce((a,p)=>a+p.total,0))} em negociação</span></div>
    <div class="card kpi"><small>Pedidos em produção</small><b>${emProd}</b></div>
  </div>`;
}

/* ===== Precificação ===== */
let CALC={items:[
  {n:'Papel / substrato',t:'unit',q:1,c:0},
  {n:'Tinta / impressão',t:'unit',q:1,c:0},
  {n:'Acabamento',t:'unit',q:1,c:0},
  {n:'Arte e preparação',t:'fixo',q:1,c:0},
  {n:'Mão de obra (horas)',t:'fixo',q:1,c:0}
],qty:100,method:'margem',p:null,concorrente:0,prazo:''};
function vPreco(){
  if(!CALC.p)CALC.p={imposto:S.config.imposto,despesas:S.config.despesas,comissao:S.config.comissao,margem:S.config.margem};
  $('#view').innerHTML=`
  <h1>Precificação</h1><p class="sub">Monte o custo real do trabalho, defina a margem e veja o preço por quantidade.</p>
  <div class="gp">
   <div>
    <div class="card"><h3>Catálogo de serviços</h3><div class="bar" style="margin:0"><select id="catSel" style="flex:1;min-width:160px"><option value="">Escolha um serviço salvo…</option>${S.catalogo.map(c=>`<option value="${c.id}">${h(c.nome)}</option>`).join('')}</select><button class="ghost sm" id="catLoad">Carregar</button><button class="ghost sm" id="catSave">Salvar atual</button><button class="danger sm" id="catDel">×</button></div></div>
    <div class="card" style="margin-top:14px"><h3>Custos do trabalho</h3>
      <div style="overflow-x:auto"><table id="items"></table></div>
      <div class="bar" style="margin:10px 0 0"><button class="ghost sm" id="addItem">+ Item de custo</button><select id="srcSel" style="width:auto;max-width:220px">${srcOptions()}</select><button class="ghost sm" id="addSrc">+ Do cadastro</button>
      <span style="font-size:12px;color:var(--muted)"><b>Por unidade</b>: multiplica pela quantidade (papel, tinta). <b>Fixo</b>: cobrado uma vez (arte, setup, horas).</span></div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Parâmetros</h3>
      <div class="row">
        <div><label>Quantidade</label><input id="qty" type="number" min="1" value="${CALC.qty}"></div>
        <div><label>Método</label><select id="method"><option value="margem" ${CALC.method==='margem'?'selected':''}>Margem sobre o preço</option><option value="markup" ${CALC.method==='markup'?'selected':''}>Markup sobre o custo</option></select></div>
        <div><label id="lm">${CALC.method==='margem'?'Margem desejada (%)':'Markup (%)'}</label><input id="margem" type="number" step="0.5" value="${CALC.p.margem}"></div>
      </div>
      <div class="row">
        <div><label>Impostos (% do preço)</label><input id="imposto" type="number" step="0.1" value="${CALC.p.imposto}"></div>
        <div><label>Despesas fixas (% do preço)</label><input id="despesas" type="number" step="0.1" value="${CALC.p.despesas}"></div>
        <div><label>Comissão / taxas (%)</label><input id="comissao" type="number" step="0.1" value="${CALC.p.comissao}"></div>
      </div>
      <div class="row"><div><label>Preço do concorrente (total, opcional)</label><input id="conc" type="number" step="0.01" value="${CALC.concorrente||''}" placeholder="0,00"></div></div>
    </div>
   </div>
   <div>
    <div class="card" id="resCard"></div>
    <div class="card" style="margin-top:14px"><h3>Preço por quantidade</h3><div style="overflow-x:auto" id="tiers"></div></div>
    <div class="card" style="margin-top:14px"><h3>Gerar proposta</h3>
      <div class="row">
        <div><label>Cliente</label><select id="pc">${S.clientes.map(c=>`<option value="${c.id}">${h(c.nome)}</option>`).join('')}<option value="__new">+ Novo cliente…</option></select></div>
        <div><label>Prazo de entrega</label><input id="pz" placeholder="ex.: 5 dias úteis" value="${h(CALC.prazo)}"></div>
      </div>
      <div style="margin-bottom:10px"><label>Descrição do trabalho</label><input id="pd" placeholder="ex.: 1000 cartões 4x4, couchê 300g, verniz"></div>
      <button id="mkProp">Criar proposta com este preço</button>
    </div>
   </div>
  </div>`;
  drawItems();updCalc();
  $('#addItem').onclick=()=>{CALC.items.push({n:'',t:'unit',q:1,c:0});drawItems();updCalc()};
  $('#addSrc').onclick=()=>{const v=$('#srcSel').value;if(!v)return;const [k,id]=v.split(':');
    if(k==='e'){const e=find('estoque',id);const q=num(prompt('Quantidade de '+e.nome+' por unidade produzida:','1'));if(!q)return;CALC.items.push({n:e.nome,t:'unit',q,c:e.custo})}
    else{const o=k==='c'?find('centros',id):find('equipe',id);const q=num(prompt('Horas de '+o.nome+' neste trabalho:','1'));if(!q)return;
      CALC.items.push({n:(k==='c'?'Máquina/processo: ':'Mão de obra: ')+o.nome,t:'fixo',q,c:+(k==='c'?custoHora(o):custoHoraP(o)).toFixed(2)})}
    drawItems();updCalc()};
  $('#catSave').onclick=()=>{const n=prompt('Nome do serviço (ex.: Cartão de visita 4x4):');if(!n)return;
    S.catalogo.push({id:uid(),nome:n.trim(),items:JSON.parse(JSON.stringify(CALC.items)),p:{...CALC.p},method:CALC.method,qty:CALC.qty});save();vPreco()};
  $('#catLoad').onclick=()=>{const c=find('catalogo',$('#catSel').value);if(!c)return;CALC.items=JSON.parse(JSON.stringify(c.items));CALC.p={...c.p};CALC.method=c.method;CALC.qty=c.qty;vPreco()};
  $('#catDel').onclick=()=>{const id=$('#catSel').value;if(id&&confirm('Remover serviço do catálogo?')){rm('catalogo',id);save();vPreco()}};
  ['qty','method','margem','imposto','despesas','comissao','conc'].forEach(id=>$('#'+id).addEventListener('input',()=>{
    CALC.qty=Math.max(1,Math.floor(num($('#qty').value))||1);CALC.method=$('#method').value;
    $('#lm').textContent=CALC.method==='margem'?'Margem desejada (%)':'Markup (%)';
    CALC.p={margem:num($('#margem').value),imposto:num($('#imposto').value),despesas:num($('#despesas').value),comissao:num($('#comissao').value)};
    CALC.concorrente=num($('#conc').value);updCalc();
  }));
  $('#pz').addEventListener('input',e=>CALC.prazo=e.target.value);
  $('#mkProp').onclick=mkProposta;
}
function drawItems(){
  $('#items').innerHTML=`<tr><th>Item</th><th>Tipo</th><th>Qtd</th><th>Custo unit.</th><th class="tr">Subtotal</th><th></th></tr>`+
  CALC.items.map((i,k)=>`<tr data-k="${k}">
    <td><input data-f="n" value="${h(i.n)}" placeholder="Descrição" style="min-width:110px"></td>
    <td><select data-f="t" style="min-width:84px"><option value="unit" ${i.t==='unit'?'selected':''}>Por un.</option><option value="fixo" ${i.t==='fixo'?'selected':''}>Fixo</option></select></td>
    <td><input data-f="q" type="number" step="0.01" value="${i.q}" style="width:64px"></td>
    <td><input data-f="c" type="number" step="0.01" value="${i.c}" style="width:84px"></td>
    <td class="tr sub">${brl(num(i.q)*num(i.c))}</td>
    <td><button class="danger sm" data-del="${k}">×</button></td></tr>`).join('');
}
document.addEventListener('input',e=>{
  const tr=e.target.closest('#items tr[data-k]');if(!tr||!e.target.dataset.f)return;
  const it=CALC.items[+tr.dataset.k],f=e.target.dataset.f;
  it[f]=(f==='n'||f==='t')?e.target.value:num(e.target.value);
  tr.querySelector('.sub').textContent=brl(num(it.q)*num(it.c));updCalc();
});
document.addEventListener('click',e=>{
  const d=e.target.dataset&&e.target.dataset.del;
  if(d!==undefined&&e.target.closest('#items')){CALC.items.splice(+d,1);drawItems();updCalc()}
});
function updCalc(){
  const r=compute(CALC.items,CALC.qty,CALC.p,CALC.method);
  const sem=r.custo<=0;
  let sig='';
  if(!sem&&!r.erro){
    const m=r.mReal*100;
    sig=m>=25?`<div class="sig ok">Margem real de ${pct(m)} — saudável.</div>`:m>=12?`<div class="sig mid">Margem real de ${pct(m)} — apertada.</div>`:`<div class="sig bad">Margem real de ${pct(m)} — risco de prejuízo.</div>`;
  }
  let conc='';
  if(CALC.concorrente>0&&r.preco>0){
    const dif=r.preco-CALC.concorrente,lucroC=CALC.concorrente-r.custo-CALC.concorrente*r.ded,mC=lucroC/CALC.concorrente*100;
    conc=`<div class="sig ${CALC.concorrente<r.minimo?'bad':'mid'}">Concorrente cobra ${brl(CALC.concorrente)} (${dif>0?'você fica '+brl(dif)+' acima':'você fica '+brl(-dif)+' abaixo'}). Se igualar, sua margem real seria ${pct(mC)}${CALC.concorrente<r.minimo?' — abaixo do preço mínimo, daria prejuízo':''}.</div>`;
  }
  $('#resCard').innerHTML=`<h3>Resultado</h3>`+(r.erro?`<div class="sig bad">${h(r.erro)}</div>`:`
   <div class="res">
    <div class="big"><small>Preço de venda (${r.qty} un.)</small><b>${brl(r.preco)}</b><small>${brl(r.unit)} por unidade</small></div>
    <div><small>Custo total</small><b>${brl(r.custo)}</b></div>
    <div><small>Lucro líquido</small><b class="${r.lucro>=0?'pos':'neg'}">${brl(r.lucro)}</b></div>
    <div><small>Preço mínimo (lucro zero)</small><b>${brl(r.minimo)}</b></div>
    <div><small>Mínimo por unidade</small><b>${brl(r.minUnit)}</b></div>
    <div><small>Custo por unidade</small><b>${brl(r.custo/r.qty)}</b></div>
    <div><small>Deduções sobre o preço</small><b>${brl(r.preco*r.ded)}</b></div>
   </div>${sig}${conc}`);
  const qs=[...new Set([10,50,100,250,500,1000,2000,5000,CALC.qty])].sort((a,b)=>a-b);
  $('#tiers').innerHTML=`<table><tr><th>Qtd</th><th class="tr">Total</th><th class="tr">Unitário</th><th class="tr">Lucro</th></tr>`+qs.map(q=>{const x=compute(CALC.items,q,CALC.p,CALC.method);return x.erro?'':`<tr ${q===CALC.qty?'style="font-weight:700"':''}><td>${q}</td><td class="tr">${brl(x.preco)}</td><td class="tr">${brl(x.unit)}</td><td class="tr ${x.lucro>=0?'pos':'neg'}">${brl(x.lucro)}</td></tr>`}).join('')+`</table><p style="font-size:12px;color:var(--muted);margin:8px 0 0">Custos fixos são diluídos: quanto maior a quantidade, menor o preço unitário.</p>`;
}
function mkProposta(){
  const r=compute(CALC.items,CALC.qty,CALC.p,CALC.method);
  if(r.erro||r.preco<=0){alert('Preencha os custos antes de gerar a proposta.');return}
  const desc=$('#pd').value.trim();if(!desc){alert('Descreva o trabalho.');$('#pd').focus();return}
  let cid=$('#pc').value;
  if(cid==='__new'||!cid){const n=prompt('Nome do cliente:');if(!n)return;cid=uid();S.clientes.push({id:cid,nome:n.trim(),contato:'',obs:''})}
  S.seq++;
  S.propostas.push({id:uid(),num:'P'+new Date().getFullYear()+'-'+String(S.seq).padStart(3,'0'),cliente:cid,desc,qtd:r.qty,unit:r.unit,total:r.preco,custo:r.custo,prazo:$('#pz').value,
    criada:today(),validade:addDays(S.config.validade||7),status:'rascunho',lanc:null});
  save();location.hash='#propostas';
}

/* ===== Propostas ===== */
function vPropostas(){
  const ps=[...S.propostas].reverse();
  $('#view').innerHTML=`<h1>Propostas</h1><p class="sub">Aprovou? O valor entra automaticamente em contas a receber.</p>
  <div class="card">${ps.length?`<div style="overflow-x:auto"><table><tr><th>Nº</th><th>Cliente</th><th>Trabalho</th><th class="tr">Valor</th><th>Validade</th><th>Status</th><th></th></tr>
  ${ps.map(p=>`<tr><td>${h(p.num)}</td><td>${h(cliNome(p.cliente))}</td><td>${h(p.desc)}</td><td class="tr">${brl(p.total)}</td><td>${fdate(p.validade)}</td>
   <td><select data-st="${p.id}">${['rascunho','enviada','aprovada','recusada'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
   <td style="white-space:nowrap"><button class="ghost sm" data-ver="${p.id}">Ver / imprimir</button>${p.status==='aprovada'?` <button class="ghost sm" data-gp="${p.id}">Gerar pedido</button> <button class="ghost sm" data-gc="${p.id}">Contrato</button>`:''} <button class="danger sm" data-dp="${p.id}">×</button></td></tr>`).join('')}</table></div>`
  :'<div class="empty">Nenhuma proposta ainda. Calcule um preço em <a href="#preco">Precificação</a> e gere a proposta.</div>'}</div>`;
  document.querySelectorAll('[data-st]').forEach(el=>el.onchange=()=>{
    const p=S.propostas.find(x=>x.id===el.dataset.st);p.status=el.value;
    if(p.status==='aprovada'&&!p.lanc){const id=uid();p.lanc=id;S.lancamentos.push({id,tipo:'receber',desc:`${p.num} — ${cliNome(p.cliente)}`,valor:p.total,venc:addDays(15),pago:false,pagoEm:null})}
    save();vPropostas();
  });
  document.querySelectorAll('[data-ver]').forEach(el=>el.onclick=()=>verProposta(el.dataset.ver));
  ONC('[data-gp]','gp',genPedido);ONC('[data-gc]','gc',genContrato);
  document.querySelectorAll('[data-dp]').forEach(el=>el.onclick=()=>{if(confirm('Excluir esta proposta?')){S.propostas=S.propostas.filter(x=>x.id!==el.dataset.dp);save();vPropostas()}});
}
function verProposta(id){
  const p=S.propostas.find(x=>x.id===id);if(!p)return;
  const c=S.clientes.find(x=>x.id===p.cliente)||{};
  $('#doc').innerHTML=`
  <div class="noprint" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:20px"><button onclick="window.print()">Imprimir / salvar PDF</button><button class="ghost" style="color:#111" onclick="$('#overlay').style.display='none'">Fechar</button></div>
  <h2>${h(S.config.empresa)}</h2><p style="color:#555;margin:2px 0 24px">Proposta comercial ${h(p.num)} · emitida em ${fdate(p.criada)}</p>
  <p><b>Para:</b> ${h(c.nome||'—')}${c.contato?'<br>'+h(c.contato):''}</p>

   ${ls.length?`<div style="overflow-x:auto"><table><tr><th>Vencimento</th><th>Descrição</th><th>Tipo</th><th class="tr">Valor</th><th>Situação</th><th></th></tr>
   ${ls.map(l=>`<tr><td>${fdate(l.venc)}</td><td>${h(l.desc)}</td><td>${l.tipo==='receber'?'Receber':'Pagar'}</td><td class="tr ${l.tipo==='receber'?'pos':'neg'}">${l.tipo==='receber'?'':'−'}${brl(l.valor)}</td>

function pedCalc(p){const o=S.os.find(x=>x.pedido===p.id);const cos=o?osCusto(o):0;const real=num(p.custoMat)>0;

  $('#padd').onclick=()=>{const d=V('pd'),pr=num(V('pp'));if(!V('pc')||!d||pr<=0){alert('Escolha o cliente e informe descrição e preço.');return}

/* ---- Produção (OS por etapas) ---- */
function abrirOS(pid){S.os.push({id:uid(),num:'OS'+year()+'-'+seqN('seqOS'),pedido:pid,prazo:addDays(7),etapas:['Pré-impressão','Impressão','Acabamento','Expedição'].map(n=>({nome:n,status:'pendente',centro:'',horas:0}))});save();location.hash='#producao'}
function syncPedido(o){const p=find('pedidos',o.pedido);if(!p)return;const st=o.etapas.map(e=>e.status);
  if(st.length&&st.every(s=>s==='feito')){if(p.status!=='entregue')p.status='pronto'}else if(st.some(s=>s!=='pendente')&&p.status==='novo')p.status='em produção'}
function vProducao(){
  const os=[...S.os].reverse();
  $('#view').innerHTML=head('Produção','Ordens de serviço por etapas, com horas apontadas por centro de custo. O custo apontado entra na margem real do pedido.')+
  (os.length?os.map(o=>{const p=find('pedidos',o.pedido)||{};const fe=o.etapas.filter(e=>e.status==='feito').length;const pr=o.etapas.length?fe/o.etapas.length*100:0;
   return `<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center"><h3 style="margin:0">${h(o.num)} · ${h(cliNome(p.cliente))} — ${h(p.desc||'')}</h3>
   <div class="bar" style="margin:0"><label style="margin:0">Prazo</label><input type="date" data-op="${o.id}" value="${o.prazo||''}" style="width:150px"><button class="danger sm" data-dos="${o.id}">×</button></div></div>
   <div class="prog"><i style="width:${pr}%"></i></div>
   <div style="overflow-x:auto"><table><tr><th>Etapa</th><th>Situação</th><th>Centro de custo</th><th>Horas</th><th class="tr">Custo</th></tr>
   ${o.etapas.map((e,i)=>{const cc=find('centros',e.centro);return `<tr><td>${h(e.nome)}</td>
    <td><select data-os="${o.id}" data-i="${i}" data-f="status">${['pendente','andamento','feito'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><select data-os="${o.id}" data-i="${i}" data-f="centro"><option value="">—</option>${S.centros.map(c=>`<option value="${c.id}" ${e.centro===c.id?'selected':''}>${h(c.nome)}</option>`).join('')}</select></td>
    <td><input type="number" step="0.25" min="0" style="width:80px" data-os="${o.id}" data-i="${i}" data-f="horas" value="${e.horas||0}"></td>
    <td class="tr">${brl(num(e.horas)*(cc?custoHora(cc):0))}</td></tr>`}).join('')}</table></div>
   <div class="bar" style="margin:10px 0 0"><button class="ghost sm" data-et="${o.id}">+ Etapa</button><b style="margin-left:auto">Custo de produção apontado: ${brl(osCusto(o))}</b></div></div>`}).join('')
  :EMP('Nenhuma ordem de serviço. Abra uma OS a partir de um pedido.'));
  document.querySelectorAll('[data-os]').forEach(el=>el.onchange=()=>{const o=find('os',el.dataset.os),e=o.etapas[+el.dataset.i],f=el.dataset.f;e[f]=f==='horas'?num(el.value):el.value;syncPedido(o);save();vProducao()});
  document.querySelectorAll('[data-op]').forEach(el=>el.onchange=()=>{find('os',el.dataset.op).prazo=el.value;save()});
  ONC('[data-et]','et',id=>{const n=prompt('Nome da etapa:');if(!n)return;find('os',id).etapas.push({nome:n.trim(),status:'pendente',centro:'',horas:0});save();vProducao()});
  ONC('[data-dos]','dos',id=>{if(confirm('Excluir esta OS?')){rm('os',id);save();vProducao()}});
}

/* ---- Agenda ---- */
function eventos(){
  const ev=[];
  S.agenda.forEach(a=>ev.push({d:a.data,t:(a.hora?a.hora+' · ':'')+a.titulo,tag:'compromisso',id:a.id}));
  S.tarefas.filter(t=>t.st<2&&t.prazo).forEach(t=>ev.push({d:t.prazo,t:'Tarefa: '+t.titulo,tag:'tarefa'}));
  S.os.forEach(o=>{if(o.prazo&&!o.etapas.every(e=>e.status==='feito'))ev.push({d:o.prazo,t:o.num+' — entrega da produção',tag:'produção'})});
  S.projetos.filter(p=>p.fase!=='entregue'&&p.prazo).forEach(p=>ev.push({d:p.prazo,t:'Projeto: '+p.nome,tag:'projeto'}));
  S.propostas.filter(p=>p.status==='enviada').forEach(p=>ev.push({d:p.validade,t:p.num+' vence (follow-up com '+cliNome(p.cliente)+')',tag:'proposta'}));
  S.lancamentos.filter(l=>!l.pago&&l.venc).forEach(l=>ev.push({d:l.venc,t:(l.tipo==='receber'?'Receber: ':'Pagar: ')+l.desc+' — '+brl(l.valor),tag:l.tipo}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  return ev;
}

function vAgenda(){
  const ev=eventos();
  const td=today(),atras=ev.filter(e=>e.d<td),fut=ev.filter(e=>e.d>=td);
  const li=e=>`<tr><td style="white-space:nowrap">${fdate(e.d)}</td><td>${h(e.t)}</td><td><span class="pill p-rascunho">${e.tag}</span></td><td>${e.id?`<button class="danger sm" data-da="${e.id}">×</button>`:''}</td></tr>`;
  $('#view').innerHTML=head('Agenda','Compromissos, prazos de tarefas, produção e projetos, validade de propostas e vencimentos financeiros, tudo num lugar.')+
  `<div class="card"><h3>Novo compromisso</h3><div class="row">${F('ad','Data','date',td)}${F('ah','Hora','time')}${F('at','Título')}</div><button id="aadd">Adicionar</button></div>
  ${atras.length?`<div class="card" style="margin-top:14px"><h3 class="neg">Atrasados</h3><table>${atras.map(li).join('')}</table></div>`:''}
  <div class="card" style="margin-top:14px"><h3>Próximos</h3>${fut.length?`<table>${fut.map(li).join('')}</table>`:EMP('Agenda vazia.')}</div>`;
  $('#aadd').onclick=()=>{if(!V('at')||!V('ad')){alert('Informe data e título.');return}S.agenda.push({id:uid(),data:V('ad'),hora:V('ah'),titulo:V('at')});save();vAgenda()};
  ONC('[data-da]','da',id=>{rm('agenda',id);save();vAgenda()});
}

/* ---- Contratos ---- */
function genContrato(pid){const p=find('propostas',pid);if(!p)return;
  const vars={empresa:S.config.empresa,cliente:cliNome(p.cliente),descricao:p.desc,quantidade:p.qtd,valor:brl(p.total),prazo:p.prazo||'a combinar',data:fdate(today())};
  const texto=S.modeloContrato.replace(/\{\{(\w+)\}\}/g,(m,k)=>k in vars?vars[k]:m);
  const c={id:uid(),proposta:pid,cliente:p.cliente,texto,data:today()};S.contratos.push(c);save();verContrato(c.id);
  if(location.hash!=='#contratos')location.hash='#contratos'}
function verContrato(id){const c=find('contratos',id);if(!c)return;
  $('#doc').innerHTML=`<div class="noprint" style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:20px"><button onclick="window.print()">Imprimir / salvar PDF</button><button class="ghost" style="color:#111" onclick="$('#overlay').style.display='none'">Fechar</button></div><pre style="white-space:pre-wrap;font:15px/1.6 Georgia,serif;margin:0">${h(c.texto)}</pre>`;
  $('#overlay').style.display='flex'}
function vContratos(){
  $('#view').innerHTML=head('Contratos','Gere o contrato a partir de uma proposta aprovada. Assinatura aqui é no papel ou no PDF impresso, não eletrônica.')+
  `<div class="card"><h3>Modelo</h3><p style="font-size:12px;color:var(--muted);margin-top:0">Variáveis: {{empresa}} {{cliente}} {{descricao}} {{quantidade}} {{valor}} {{prazo}} {{data}}</p><textarea id="cm2" rows="14">${h(S.modeloContrato)}</textarea><div style="margin-top:10px"><button id="csave2">Salvar modelo</button></div></div>
  <div class="card" style="margin-top:14px"><h3>Contratos gerados</h3>${S.contratos.length?`<table>${[...S.contratos].reverse().map(c=>`<tr><td>${fdate(c.data)}</td><td>${h(cliNome(c.cliente))}</td><td class="tr"><button class="ghost sm" data-vc="${c.id}">Ver / imprimir</button> <button class="danger sm" data-dk="${c.id}">×</button></td></tr>`).join('')}</table>`:EMP('Nenhum contrato. Use o botão “Contrato” em uma proposta aprovada.')}</div>`;
  $('#csave2').onclick=()=>{S.modeloContrato=$('#cm2').value;save();alert('Modelo salvo.')};
  ONC('[data-vc]','vc',verContrato);ONC('[data-dk]','dk',id=>{if(confirm('Excluir contrato?')){rm('contratos',id);save();vContratos()}});
}

/* ---- Pós-venda ---- */
function vPosvenda(){
  const dias=window.__pv||60;
  const rows=S.clientes.map(c=>{const ds=[...S.pedidos.filter(p=>p.cliente===c.id).map(p=>p.criado),...S.propostas.filter(p=>p.cliente===c.id&&p.status==='aprovada').map(p=>p.criada)].sort();
    const last=ds.length?ds[ds.length-1]:null;const n=last?Math.floor((new Date(today())-new Date(last))/864e5):null;return {c,last,n}}).filter(r=>r.n===null||r.n>=dias).sort((a,b)=>(b.n??9999)-(a.n??9999));
  $('#view').innerHTML=head('Pós-venda e recompra','Clientes parados há tempo: cliente esquecido é dinheiro esquecido.')+
  `<div class="card"><div class="bar" style="margin:0"><label style="margin:0">Sem comprar há pelo menos</label><input id="pvd" type="number" value="${dias}" style="width:90px"><span>dias</span></div></div>
  <div class="card" style="margin-top:14px">${rows.length?`<table><tr><th>Cliente</th><th>Última compra</th><th>Parado há</th><th></th></tr>${rows.map(({c,last,n})=>{let d=(c.contato||'').replace(/\D/g,'');if(d.length>=10&&!d.startsWith('55'))d='55'+d;
   const msg=encodeURIComponent(`Olá, ${c.nome}! Aqui é da ${S.config.empresa}. Faz um tempinho que não fazemos um trabalho juntos. Precisa de algo? Posso te passar um orçamento.`);
   return `<tr><td><b>${h(c.nome)}</b></td><td>${last?fdate(last):'nunca comprou'}</td><td>${n===null?'—':n+' dias'}</td><td class="tr">${d.length>=12?`<a href="https://wa.me/${d}?text=${msg}" target="_blank" rel="noopener"><button class="ghost sm">WhatsApp</button></a>`:'<small style="color:var(--muted)">sem telefone</small>'}</td></tr>`}).join('')}</table>`:EMP('Nenhum cliente parado')}</div>`;
  $('#pvd').onchange=e=>{window.__pv=Math.max(1,num(e.target.value)||60);vPosvenda()};
}

/* ---- Portfólio ---- */
function vPortfolio(){
  $('#view').innerHTML=head('Portfólio','Cadastre seus trabalhos e baixe uma página pública (arquivo HTML) para publicar onde quiser.')+
  `<div class="card"><h3>Novo trabalho</h3><div class="row">${F('wt','Título')}${F('wd','Descrição')}${F('wi','Link da imagem (https://…)')}</div><button id="wadd">Adicionar</button> <button class="ghost" id="wexp">Baixar página pública</button></div>
  <div class="card" style="margin-top:14px">${S.portfolio.length?`<table>${S.portfolio.map(p=>`<tr><td><b>${h(p.titulo)}</b><br><small style="color:var(--muted)">${h(p.desc)}</small></td><td class="tr"><button class="danger sm" data-dw="${p.id}">×</button></td></tr>`).join('')}</table>`:EMP('Portfólio vazio.')}</div>`;
  $('#wadd').onclick=()=>{if(!V('wt')){$('#wt').focus();return}S.portfolio.push({id:uid(),titulo:V('wt'),desc:V('wd'),img:V('wi')});save();vPortfolio()};
  ONC('[data-dw]','dw',id=>{rm('portfolio',id);save();vPortfolio()});
  $('#wexp').onclick=()=>{const it=S.portfolio.map(p=>`<article>${/^https?:\/\//.test(p.img)?`<img src="${h(p.img)}" alt="${h(p.titulo)}">`:''}<h3>${h(p.titulo)}</h3><p>${h(p.desc)}</p></article>`).join('');
    const html='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+h(S.config.empresa)+' — Portfólio</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#0f172a}header{background:#0b1f2a;color:#fff;padding:40px 20px;text-align:center}main{max-width:1000px;margin:auto;padding:20px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}article{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px #0002}article img{width:100%;aspect-ratio:4/3;object-fit:cover}article h3,article p{margin:12px}</style><header><h1>'+h(S.config.empresa)+'</h1><p>Portfólio</p></header><main>'+it+'</main>';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='portfolio.html';a.click()};
}

/* ---- Assistente local ---- */
let CHAT=[{b:1,t:'Oi! Pergunte sobre meta, contas a receber/pagar, atrasos, propostas abertas, pedidos, estoque ou clientes parados. Respondo só com os dados deste navegador, sem IA externa.'}];
function answer(q){
  q=q.toLowerCase();const mk=mesKey(today()),rec=somaMes('receber',mk),meta=num(S.config.meta);
  const aRec=S.lancamentos.filter(l=>l.tipo==='receber'&&!l.pago),aPag=S.lancamentos.filter(l=>l.tipo==='pagar'&&!l.pago);
  const sum=a=>a.reduce((x,l)=>x+l.valor,0);
  if(/meta/.test(q))return meta?`Você recebeu ${brl(rec)} neste mês, ${pct(rec/meta*100)} da meta de ${brl(meta)}. ${rec>=meta?'Meta batida!':'Faltam '+brl(meta-rec)+'.'} Ainda tem ${brl(sum(aRec))} a receber.`:'Defina a meta mensal em Ajustes.';
  if(/atras|vencid/.test(q)){const a=S.lancamentos.filter(l=>!l.pago&&stLanc(l)==='atrasado');return a.length?`${a.length} lançamento(s) em atraso:\n`+a.map(l=>`• ${fdate(l.venc)} — ${l.desc} (${brl(l.valor)})`).join('\n'):'Nada em atraso.'}
  if(/propost/.test(q)){const a=S.propostas.filter(p=>p.status==='rascunho'||p.status==='enviada');return a.length?`${a.length} proposta(s) aberta(s), somando ${brl(a.reduce((x,p)=>x+p.total,0))}:\n`+a.map(p=>`• ${p.num} — ${cliNome(p.cliente)} (${brl(p.total)}, ${p.status})`).join('\n'):'Nenhuma proposta aberta.'}
  if(/estoque|repor|reposi|acabando/.test(q)){const l=S.estoque.filter(e=>num(e.qtd)<=num(e.min));return l.length?'Itens no mínimo ou abaixo:\n'+l.map(e=>`• ${e.nome}: ${e.qtd} ${e.un} (mín. ${e.min})`).join('\n'):'Estoque acima do mínimo em tudo.'}
  if(/pedido|produ|entrega/.test(q)){const a=S.pedidos.filter(p=>p.status!=='entregue');return a.length?`${a.length} pedido(s) em andamento:\n`+a.map(p=>`• ${p.num} — ${cliNome(p.cliente)} (${p.status}, margem ${pct(pedCalc(p).m)})`).join('\n'):'Nenhum pedido em andamento.'}
  if(/pagar|conta|devo|despesa/.test(q))return `Você tem ${brl(sum(aPag))} a pagar em ${aPag.length} lançamento(s).`;
  if(/receb|faturei|faturamento|entrou/.test(q))return `Recebido neste mês: ${brl(rec)}. A receber: ${brl(sum(aRec))} em ${aRec.length} lançamento(s).`;
  if(/cliente|recompra|parado/.test(q))return 'Veja a tela Pós-venda: lá estão os clientes sem comprar há tempo, com link de WhatsApp.';
  return 'Não entendi. Tente: "como estou na meta?", "quanto tenho a receber?", "o que está atrasado?", "propostas abertas", "estoque baixo" ou "pedidos em andamento".';
}
function vAssistente(){
  $('#view').innerHTML=head('Assistente','Assistente local: responde com base nos dados deste navegador (não é IA externa e não usa Telegram).')+
  `<div class="card"><div class="chat" id="chat">${CHAT.map(m=>`<div class="msg ${m.b?'bot':'me'}">${h(m.t)}</div>`).join('')}</div>
  <div class="bar" style="margin:0"><input id="cq2" placeholder="Pergunte algo…" style="flex:1"><button id="csend">Enviar</button></div>
  <div class="bar" style="margin:10px 0 0">${['Como estou na meta?','Quanto tenho a receber?','O que está atrasado?','Propostas abertas','Estoque baixo'].map(s=>`<button class="ghost sm" data-sg="${h(s)}">${h(s)}</button>`).join('')}</div></div>`;
  const send=t=>{t=(t||'').trim();if(!t)return;CHAT.push({t},{b:1,t:answer(t)});vAssistente();setTimeout(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight},0)};
  $('#csend').onclick=()=>send($('#cq2').value);$('#cq2').onkeydown=e=>{if(e.key==='Enter')send(e.target.value)};
  document.querySelectorAll('[data-sg]').forEach(el=>el.onclick=()=>send(el.dataset.sg));
  const c=$('#chat');c.scrollTop=c.scrollHeight;
}

Object.assign(views,{pedidos:vPedidos,producao:vProducao,estoque:vEstoque,compras:vCompras,centros:vCentros,equipe:vEquipe,tarefas:vTarefas,agenda:vAgenda,contratos:vContratos,posvenda:vPosvenda,portfolio:vPortfolio,assistente:vAssistente});
route();
</script>
